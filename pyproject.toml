[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-healer"
version = "0.1.0"
description = "Assistente visual configurável de cura para desktop Linux"
requires-python = ">=3.10"
dependencies = ["Pillow==11.3.0", "PyAutoGUI==0.9.54", "dbus-next==0.2.3"]

[project.scripts]
aion-healer = "aion_healer.app:main"

[tool.setuptools.packages.find]
include = ["aion_healer*"]
